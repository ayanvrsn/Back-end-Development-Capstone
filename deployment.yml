apiVersion: apps/v1
kind: Deployment
metadata:
  name: concert
spec:
  replicas: 1
  selector:
    matchLabels: {app: concert}
  template:
    metadata:
      labels: {app: concert}
    spec:
      containers:
      - name: concert
        image: REPLACE_WITH_REGISTRY/concert:v1
        ports: [{containerPort: 8000}]
        env:
        - {name: DJANGO_DEBUG, value: "0"}
        - {name: DJANGO_ALLOWED_HOSTS, value: ".cognitiveclass.ai,localhost,127.0.0.1"}
        - {name: SONGS_SERVICE_URL, value: "http://songs:8080"}
        - {name: PICTURES_SERVICE_URL, value: "http://pictures:8080"}
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: concert-secrets, key: django-secret-key}
---
apiVersion: v1
kind: Service
metadata:
  name: concert
spec:
  selector: {app: concert}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
